name: GHOS registry generator

on:
  push:
    branches: [governance/ghos-routing-aether-001]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact subject checkout
        env:
          SUBJECT_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Install pinned gate dependency
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: PyYAML==6.0.3
      - name: Fetch and verify governed gate
        run: |
          mkdir -p /tmp/ghos
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/grandchallenge/.github/ef1cce6029233a68cf46063cea2384772fcae613/scripts/ghos_execution_routing_gate.py \
            --output /tmp/ghos/gate.py
          echo "fc0a9a4d20de72e9fbc04c8cd54cffc3a6e4657fb09e7978b360616bd5e94a17  /tmp/ghos/gate.py" | sha256sum --check --strict
      - name: Derive exact final registry
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import importlib.util
          import json
          from collections import Counter
          from pathlib import Path
          import yaml

          spec = importlib.util.spec_from_file_location("gate", "/tmp/ghos/gate.py")
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)

          root = Path(".").resolve()
          transient = ".github/workflows/ghos-registry-generator.yml"
          paths = sorted(
              path.relative_to(root).as_posix()
              for pattern in ("*.yml", "*.yaml")
              for path in (root / ".github/workflows").glob(pattern)
              if path.is_file() and path.relative_to(root).as_posix() != transient
          )
          entries = []
          feature_counts = Counter()
          topology_counts = Counter()
          for relative in paths:
              workflow = yaml.safe_load((root / relative).read_text(encoding="utf-8"))
              observed = gate.features(workflow)
              derived = gate.topology(set(observed))
              feature_counts.update(observed)
              topology_counts.update([derived])
              entry = {
                  "path": relative,
                  "observed_features": observed,
                  "topology": derived,
              }
              if derived != "BOUNDED_ATOMIC":
                  entry["controller_id"] = "GITHUB_ACTIONS"
              entries.append(entry)

          registry = {
              "record_type": "GHOS_EXECUTION_ROUTING_REGISTRY",
              "schema_version": "1.0.0",
              "repository": "grandchallenge/AETHER",
              "controllers": gate.ADMITTED_CONTROLLERS,
              "workflows": entries,
              "claim_boundaries": gate.CLAIM_BOUNDARIES,
          }
          text = json.dumps(registry, indent=2) + "\n"
          compressed = base64.b64encode(gzip.compress(text.encode("utf-8"), compresslevel=9)).decode("ascii")
          print(f"GHOS_REGISTRY_WORKFLOW_COUNT={len(entries)}")
          print("GHOS_FEATURE_COUNTS=" + json.dumps(dict(sorted(feature_counts.items())), sort_keys=True))
          print("GHOS_TOPOLOGY_COUNTS=" + json.dumps(dict(sorted(topology_counts.items())), sort_keys=True))
          print(f"GHOS_REGISTRY_GZIP_BASE64={compressed}")
          PY
